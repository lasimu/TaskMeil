name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SKY_0C0D9F10F }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Smoke test
        run: |
          npm ci
          npm test

      - name: Deployment is not set up yet
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Add the AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SKY_0C0D9F10F repository secret to deploy (see README)."

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SKY_0C0D9F10F }}
          action: upload
          app_location: public
          api_location: ""
          output_location: ""
          skip_app_build: true
